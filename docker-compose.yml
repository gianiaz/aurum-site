services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
    environment:
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      BREVO_LIST_ID: "${BREVO_LIST_ID:-}"
    volumes:
      - .:/app
    restart: unless-stopped
