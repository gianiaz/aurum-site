server {
    listen 80;
    server_name _;
    root /app;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 2M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm ${PHP_FPM_NGINX_UPSTREAM};

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|avif|txt)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/sitemap.php;
        fastcgi_param SCRIPT_NAME /sitemap.php;
        fastcgi_pass $php_fpm;
    }

    location = /robots.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/robots.php;
        fastcgi_param SCRIPT_NAME /robots.php;
        fastcgi_pass $php_fpm;
    }

    location = /newsletter/subscribe {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/subscribe.php;
        fastcgi_param SCRIPT_NAME /subscribe.php;
        fastcgi_pass $php_fpm;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass $php_fpm;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
